<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verity</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup" data-level="none">
  <main>
    <div class="brandbar"><img src="../icons/icon32.png" alt="" width="20" height="20"><span>Verity</span></div>
    <h1 id="host">Checking…</h1>
    <div class="status" id="status"><span id="status-text"></span></div>
    <ul class="reasons small" id="reasons"></ul>

    <section id="mark" hidden>
      <h2 class="small">This site is fake?</h2>
      <label class="small" for="real">Real site (optional)</label>
      <input type="text" id="real" placeholder="something.com" autocomplete="off" spellcheck="false">
      <div class="actions"><button id="mark-btn">Add to my fake list</button></div>
      <div class="msg small" id="msg" role="status"></div>
    </section>

    <p class="small muted">Verity can make mistakes. No warning does not mean a site is safe.</p>
    <p class="small"><a href="#" id="settings">Settings and my list</a></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
