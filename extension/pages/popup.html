<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verity</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup" data-level="none">
  <div class="page">
    <header class="topbar">
      <div class="brand"><img src="../icons/icon32.png" alt="" width="26" height="26"><span>Verity</span></div>
      <label class="switch" title="Check websites as I browse">
        <input type="checkbox" id="enabled" role="switch">
        <span class="track" aria-hidden="true"></span>
        <span class="sr-only">Check websites as I browse</span>
      </label>
    </header>

    <section class="status" id="status" aria-live="polite">
      <span class="s-icon" id="s-icon"></span>
      <div>
        <h1 id="s-title">Checking…</h1>
        <div class="host" id="host"></div>
        <p class="small" id="s-text"></p>
      </div>
    </section>
    <ul class="findings" id="reasons"></ul>
    <div class="actions"><button class="btn primary sm" id="go-real" type="button" hidden></button></div>

    <section id="mark" hidden>
      <div class="actions"><button class="btn sm" id="mark-toggle" type="button" aria-expanded="false"><span data-icon="plus" data-size="16"></span>Add to my fake list</button></div>
      <div id="mark-form" hidden>
        <label class="small muted" for="real">Real site (optional)</label>
        <input type="text" id="real" placeholder="something.com" autocomplete="off" spellcheck="false">
        <div class="actions"><button class="btn primary sm" id="mark-btn" type="button">Add and reload page</button></div>
      </div>
      <div class="msg small" id="msg" role="status"></div>
    </section>

    <p class="small muted">Verity can make mistakes. No warning does not mean a site is safe.</p>
    <div class="popup-foot">
      <button class="btn ghost sm" id="settings" type="button"><span data-icon="sliders" data-size="16"></span>Settings</button>
      <span class="small muted" id="version"></span>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
